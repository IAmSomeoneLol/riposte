plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Official Fzzy Config Maven
	maven { url "https://maven.fzzyhmstrs.me/" }

	// Required by Accessories Wiki
	maven { url 'https://maven.wispforest.io/releases' }
	maven { url 'https://maven.su5ed.dev/releases' }
	maven { url 'https://maven.fabricmc.net' }
	maven { url 'https://maven.shedaniel.me/' }

	// Official Mod Menu Maven
	maven { url "https://maven.terraformersmc.com/releases/" }

	// Official Player Animator Maven
	maven { url "https://maven.kosmx.dev/" }

	// Modrinth Maven
	maven {
		name = "Modrinth"
		url = "https://api.modrinth.com/m2"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"riposte" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	// Core Modding Environment
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// Fzzy Config & Accessories
	modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}"
	modImplementation "io.wispforest:accessories-fabric:${project.accessories_version}"

	// Mod Menu
	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"

	// Player Animator
	modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_animator_version}"
}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}