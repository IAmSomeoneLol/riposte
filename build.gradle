plugins {
	id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
	// Modrinth (Exclusive)
	exclusiveContent {
		forRepository {
			maven {
				name = "Modrinth"
				url = "https://api.modrinth.com/maven"
			}
		}
		filter {
			includeGroup "maven.modrinth"
		}
	}

	maven { url "https://maven.fzzyhmstrs.me/" }
	maven { url 'https://maven.fabricmc.net' }
	maven { url 'https://maven.shedaniel.me/' }
	maven { url "https://maven.terraformersmc.com/releases/" }
	maven { url "https://maven.kosmx.dev/" }

	// Required by Trinkets to download the Cardinal Components API
	maven {
		name = "Ladysnake"
		url = "https://maven.ladysnake.org/releases"
	}
}

loom {
	splitEnvironmentSourceSets()

	mods {
		"riposte" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	modImplementation "me.fzzyhmstrs:fzzy_config:${project.fzzy_config_version}"
	modImplementation "dev.emi:trinkets:${project.trinkets_version}"

	modImplementation "com.terraformersmc:modmenu:${project.modmenu_version}"
	modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_animator_version}"

	// Better Combat & Dependencies
	modImplementation "maven.modrinth:better-combat:${project.better_combat_version}"
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}

	// ETF & EMF for testing Fresh Animations
	modLocalRuntime "maven.modrinth:entitytexturefeatures:${project.etf_version}"
	modLocalRuntime "maven.modrinth:entity-model-features:${project.emf_version}"

}

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 17
}

java {
	withSourcesJar()
	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from("LICENSE") {
		rename { "${it}_$projectName"}
	}
}

publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}
	repositories {
	}
}